[package]
name = "dunlin"
description = "Dunlin desktop app: Tauri commands and session manager"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
# Distinct from the binary name (cargo#8519).
name = "dunlin_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
dbc-core = { workspace = true, features = ["ts"] }
dbc-driver-mysql.workspace = true
dbc-driver-postgres.workspace = true
dbc-driver-sqlite.workspace = true
dbc-store = { workspace = true, features = ["ts"] }
dbc-tunnel.workspace = true
secrecy = "0.10"
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2.12", features = [] }
tauri-plugin-dialog = "2.8"
tauri-plugin-opener = "2"
thiserror.workspace = true
tracing = "0.1"
tokio.workspace = true
ts-rs.workspace = true
uuid.workspace = true
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "json", "std", "registry"] }
tauri-plugin-window-state = "2"

[dev-dependencies]
dbc-tunnel = { workspace = true, features = ["test-support"] }
testcontainers-modules = { version = "0.15", features = ["postgres"] }
async-trait.workspace = true
secrecy = "0.10"
dbc-core = { workspace = true, features = ["ts", "test-support"] }
rusqlite.workspace = true
tempfile.workspace = true

[lints]
workspace = true
