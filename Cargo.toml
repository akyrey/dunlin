[workspace]
resolver = "3"
members = [
    "crates/dbc-core",
    "crates/dbc-driver-sqlite",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
publish = false

[workspace.dependencies]
dbc-core = { path = "crates/dbc-core" }
dbc-driver-sqlite = { path = "crates/dbc-driver-sqlite" }
dbc-store = { path = "crates/dbc-store" }

async-trait = "0.1"
base64 = "0.23"
proptest = "1"
rstest = "0.28"
rusqlite = { version = "0.42", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
ts-rs = "12"
uuid = { version = "1", features = ["v4", "serde"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
