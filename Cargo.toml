[workspace]
resolver = "3"
members = [
    "crates/dbc-core",
    "crates/dbc-driver-postgres",
    "crates/dbc-driver-mysql",
    "crates/dbc-driver-sqlite",
    "crates/dbc-driver-redis",
    "crates/dbc-store",
    "crates/dbc-tunnel",
    "crates/roost-keychain",
    "crates/roost-shell",
    "apps/desktop/src-tauri",
]

[workspace.package]
version = "0.1.4"
edition = "2024"
rust-version = "1.90"
license = "MIT"
publish = false

[workspace.dependencies]
dbc-core = { path = "crates/dbc-core" }
dbc-driver-mysql = { path = "crates/dbc-driver-mysql" }
dbc-driver-postgres = { path = "crates/dbc-driver-postgres" }
dbc-driver-sqlite = { path = "crates/dbc-driver-sqlite" }
dbc-driver-redis = { path = "crates/dbc-driver-redis" }
dbc-store = { path = "crates/dbc-store" }
dbc-tunnel = { path = "crates/dbc-tunnel" }
# The shared kit (Roost): moves to the Roost repository, then becomes a git dependency.
roost-keychain = { path = "crates/roost-keychain" }
roost-shell = { path = "crates/roost-shell" }

async-trait = "0.1"
base64 = "0.23"
insta = { version = "1.49", features = ["json", "filters"] }
proptest = "1"
rstest = "0.28"
rusqlite = { version = "0.42", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
ts-rs = "12"
uuid = { version = "1", features = ["v4", "serde"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

# Tauri recommends these for small release binaries.
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
