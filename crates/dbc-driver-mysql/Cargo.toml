[package]
name = "dbc-driver-mysql"
description = "MySQL and MariaDB driver"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
async-trait.workspace = true
dbc-core.workspace = true
mysql_async = { version = "0.37.1", default-features = false, features = ["minimal-rust", "rustls-tls", "ring"] }
rustls = { version = "0.23.46", default-features = false }
secrecy = "0.10"
tokio = { workspace = true, features = ["time", "sync"] }

[dev-dependencies]
insta.workspace = true
dbc-tunnel = { workspace = true, features = ["test-support"] }
dbc-core = { workspace = true, features = ["test-support"] }
rcgen = "0.14"
rstest.workspace = true
tempfile.workspace = true
secrecy = "0.10"
testcontainers-modules = { version = "0.15", features = ["mysql", "mariadb"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }

[lints]
workspace = true
