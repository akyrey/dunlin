[package]
name = "dbc-tunnel"
description = "SSH local port forwarding for database connections"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = []
# OpenSSH test servers and client keys, for this crate's and other crates' integration tests.
test-support = ["dep:testcontainers-modules", "dep:tempfile"]

[dependencies]
russh = { version = "0.65", default-features = false, features = ["ring", "rsa", "flate2"] }
secrecy = "0.10"
tempfile = { workspace = true, optional = true }
testcontainers-modules = { version = "0.15", optional = true }
thiserror.workspace = true
tokio = { workspace = true, features = ["net", "io-util", "sync", "time"] }

[dev-dependencies]
dbc-tunnel = { path = ".", features = ["test-support"] }
rstest.workspace = true
proptest.workspace = true
secrecy = "0.10"
tempfile.workspace = true
testcontainers-modules = { version = "0.15", features = ["postgres"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "net", "io-util"] }

[lints]
workspace = true
