[package]
name = "dbc-tunnel"
description = "SSH local port forwarding for database connections"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
russh = { version = "0.65", default-features = false, features = ["ring", "rsa", "flate2"] }
secrecy = "0.10"
thiserror.workspace = true
tokio = { workspace = true, features = ["net", "io-util", "sync", "time"] }

[dev-dependencies]
rstest.workspace = true
secrecy = "0.10"
tempfile.workspace = true
testcontainers-modules = { version = "0.15", features = ["postgres"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "net", "io-util"] }

[lints]
workspace = true
