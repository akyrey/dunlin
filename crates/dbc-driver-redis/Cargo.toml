[package]
name = "dbc-driver-redis"
description = "Redis and Valkey driver"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
async-trait.workspace = true
dbc-core.workspace = true
redis = { version = "1.8", default-features = false, features = ["aio", "tokio-comp", "streams"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-native-certs = "0.8"
secrecy = "0.10"
serde_json.workspace = true
tokio = { workspace = true, features = ["net", "time", "rt"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }

[dev-dependencies]
dbc-core = { workspace = true, features = ["test-support"] }
proptest.workspace = true
testcontainers-modules = { version = "0.15", features = ["redis"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }

[lints]
workspace = true
