[package]
name = "dbc-driver-postgres"
description = "PostgreSQL driver"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
async-trait.workspace = true
dbc-core.workspace = true
futures-util = { version = "0.3", default-features = false, features = ["std", "async-await-macro"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-native-certs = "0.8"
secrecy = "0.10"
tokio = { workspace = true, features = ["net", "time"] }
tokio-postgres = { version = "0.7.18", default-features = false, features = ["runtime"] }
tokio-postgres-rustls = { version = "0.14", default-features = false, features = ["ring"] }

[dev-dependencies]
bytes = "1"
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"] }
insta.workspace = true
async-trait.workspace = true
dbc-tunnel = { workspace = true, features = ["test-support"] }
dbc-core = { workspace = true, features = ["test-support"] }
rcgen = "0.14"
rstest.workspace = true
tempfile.workspace = true
testcontainers-modules = { version = "0.15", features = ["postgres"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }

[lints]
workspace = true
